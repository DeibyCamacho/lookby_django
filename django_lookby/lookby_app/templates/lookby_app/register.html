{% extends 'lookby_app/base.html' %}

{% block title %}Crear cuenta — LookBy{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
  <main class="auth-shell">
    <div class="auth-card">
      <p class="eyebrow text-center">Crea tu cuenta</p>
      <h1 class="auth-title">Regístrate</h1>

      <form method="post">
        {% csrf_token %}
        <div class="form-group">
          <label for="name">Nombre</label>
          <input id="name" name="name" type="text" placeholder="María López" required />
        </div>
        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" placeholder="usuario@email.cl" required />
        </div>
        <div class="form-group">
          <label for="role">Tipo de cuenta</label>
          <select id="role" name="role">
            <option value="client">Cliente</option>
            <option value="business">Negocio</option>
            <option value="supplier">Proveedor</option>
          </select>
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required />
        </div>
        <button type="submit" class="btn btn-gold w-full">Crear cuenta</button>
      </form>

      <p class="auth-footer">
        Ya tienes cuenta? <a href="{% url 'login' %}" class="link-gold">Inicia sesión</a>
      </p>
    </div>
  </main>
{% endblock %}
